<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal de gestión de empleados - Coéxito" />
    <title>Coéxito | Gestión de Empleados</title>
 
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>
 
  <body>
 
    <main class="main-wrapper" role="main">
 
      <div class="login-container">

        <header class="login-header" role="banner">
          <img
            src="assets/img/logo-coexito.png"
            alt="Logo Coéxito"
            class="login-logo"
            onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';"
          />

          <div id="logo-fallback" class="logo-fallback" style="display:none;" aria-hidden="true">
            <span class="logo-text-blue">coéxito</span>
            <span class="logo-icon">🔧</span>
          </div>
          <h1 class="login-title">Gestión de empleados</h1>
        </header>
 
        <section class="login-card" aria-label="Formulario de inicio de sesión">
 
          <form
            id="loginForm"
            class="login-form"
            novalidate
            aria-label="Formulario de login"
          >

            <div class="form-group">
              <label for="email" class="form-label">Correo Electrónico</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-input"
                  placeholder="ejemplo@coexito.com"
                  autocomplete="email"
                  required
                  aria-required="true"
                  aria-describedby="email-error"
                />
              </div>
              <span
                id="email-error"
                class="form-error"
                role="alert"
                aria-live="polite"
              ></span>
            </div>
 
            <div class="form-group">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B8DEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                  aria-required="true"
                  aria-describedby="password-error"
                />
              </div>
              <span
                id="password-error"
                class="form-error"
                role="alert"
                aria-live="polite"
              ></span>
            </div>
 
            <div
              id="general-error"
              class="form-error form-error--general"
              role="alert"
              aria-live="assertive"
            ></div>
 
            <button
              type="submit"
              id="submitBtn"
              class="btn-submit"
              disabled
              aria-disabled="true"
            >
              <span class="btn-text">Ingresar</span>
              <span class="btn-icon" aria-hidden="true">→</span>
            </button>
 
          </form>
        </section>
 
      </div>
    </main>
 
    <footer class="main-footer" role="contentinfo">
      <p class="footer-text">Training Developer · F5 Bootcamp</p>
    </footer>
 
    <script type="module" src="assets/js/app.js"></script>
 
  </body>
</html>
